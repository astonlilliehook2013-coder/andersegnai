<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avanza AI – Chartanalys</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Lato:wght@300;400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#00C853;--gr:#F44336;--amb:#FF9800;
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#f0f0ee;
  --bd:rgba(0,0,0,0.1);--bd2:rgba(0,0,0,0.2);
  --txt:#1a1a1a;--txt2:#666;--txt3:#999;
  --r:10px;--rs:6px
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;
    --bd:rgba(255,255,255,0.1);--bd2:rgba(255,255,255,0.2);
    --txt:#f0f0f0;--txt2:#aaa;--txt3:#666
  }
}
body{font-family:'Lato',sans-serif;background:var(--bg3);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.shell{
  font-family:'Lato',sans-serif;display:flex;flex-direction:column;
  height:700px;width:100%;max-width:960px;
  border:0.5px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--bg);
  box-shadow:0 4px 40px rgba(0,0,0,0.08)
}
.topbar{display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;border-bottom:0.5px solid var(--bd);background:var(--bg);flex-shrink:0}
.logo{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;color:var(--txt);letter-spacing:-0.02em}
.logo span{color:#00C853}
.topbar-mid{flex:1;display:flex;justify-content:center;gap:6px}
.mode-btn{padding:5px 14px;border-radius:6px;border:0.5px solid var(--bd2);background:transparent;cursor:pointer;font-size:12px;font-family:'Lato',sans-serif;color:var(--txt2);transition:all 0.12s}
.mode-btn.active{background:var(--g);color:#fff;border-color:transparent;font-weight:700}
.live-badge{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#00C853;font-family:'Syne',sans-serif}
.pulse{width:7px;height:7px;border-radius:50%;background:#00C853;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.main{display:flex;flex:1;overflow:hidden}
.left-col{width:220px;flex-shrink:0;display:flex;flex-direction:column;border-right:0.5px solid var(--bd);background:var(--bg2);overflow-y:auto}
.drop-zone{
  margin:12px;border-radius:10px;border:1.5px dashed var(--bd2);
  padding:20px 12px;text-align:center;cursor:pointer;
  transition:border-color 0.2s,background 0.2s;position:relative;
  min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px
}
.drop-zone:hover,.drop-zone.drag{border-color:#00C853;background:rgba(0,200,83,0.04)}
.drop-zone.has-img{padding:0;border-style:solid;border-color:var(--bd2)}
.drop-zone img{width:100%;border-radius:8px;display:block;max-height:160px;object-fit:cover}
.drop-icon{font-size:26px;color:var(--txt3)}
.drop-title{font-size:13px;font-weight:700;color:var(--txt);font-family:'Syne',sans-serif}
.drop-sub{font-size:11px;color:var(--txt2)}
.drop-input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.analyze-btn{
  margin:0 12px 12px;padding:10px;border-radius:8px;border:none;
  background:#00C853;color:#fff;font-size:13px;font-weight:700;
  font-family:'Syne',sans-serif;cursor:pointer;transition:opacity 0.1s;
  display:flex;align-items:center;justify-content:center;gap:6px
}
.analyze-btn:hover{opacity:0.88}
.analyze-btn:disabled{opacity:0.35;cursor:default}
.analyze-btn i{font-size:15px}
.sb-section{font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.1em;color:var(--txt3);padding:10px 14px 4px;text-transform:uppercase}
.quick-row{display:flex;flex-direction:column;gap:2px;padding:0 8px;margin-bottom:8px}
.qbtn{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-size:12px;color:var(--txt);font-family:'Lato',sans-serif;text-align:left;width:100%;transition:background 0.1s}
.qbtn:hover{background:var(--bg)}
.qbtn i{font-size:13px;opacity:0.6;flex-shrink:0}
.indicators-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 12px}
.ind-card{background:var(--bg);border:0.5px solid var(--bd);border-radius:6px;padding:7px 9px}
.ind-label{font-size:9px;color:var(--txt3);font-family:'JetBrains Mono',monospace;margin-bottom:2px}
.ind-val{font-size:13px;font-weight:500;color:var(--txt);font-family:'JetBrains Mono',monospace}
.ind-val.bull{color:#00C853}.ind-val.bear{color:#F44336}.ind-val.neu{color:#FF9800}
.right-col{display:flex;flex-direction:column;flex:1;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg-row{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse}
.msg-row.agent{align-self:flex-start}
.av{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:'Syne',sans-serif}
.av.ai{background:#00C853;color:#fff}.av.usr{background:#e8f0fe;color:#1a73e8}
.bubble{padding:10px 13px;border-radius:13px;font-size:13px;line-height:1.6;color:var(--txt);border:0.5px solid var(--bd);background:var(--bg2)}
.msg-row.user .bubble{background:#00C853;color:#fff;border-color:transparent;border-radius:13px 13px 4px 13px}
.msg-row.agent .bubble{border-radius:4px 13px 13px 13px}
.bubble b{font-weight:700}
.bubble ul{padding-left:15px;margin:5px 0}
.bubble li{margin:3px 0}
.verdict{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:8px}
.verdict.buy{background:rgba(0,200,83,0.12);color:#00C853;border:1px solid rgba(0,200,83,0.3)}
.verdict.sell{background:rgba(244,67,54,0.1);color:#F44336;border:1px solid rgba(244,67,54,0.25)}
.verdict.hold{background:rgba(255,152,0,0.1);color:#FF9800;border:1px solid rgba(255,152,0,0.25)}
.conf-bar{height:4px;border-radius:2px;background:var(--bd);margin:4px 0 8px;overflow:hidden}
.conf-fill{height:100%;border-radius:2px;transition:width 0.8s ease}
.thumb-preview{max-width:100%;max-height:80px;border-radius:6px;margin-bottom:6px;object-fit:cover;display:block}
.typing{display:flex;gap:4px;align-items:center;padding:10px 13px;background:var(--bg2);border-radius:4px 13px 13px 13px;border:0.5px solid var(--bd);align-self:flex-start;margin-left:34px}
.typing span{width:5px;height:5px;background:var(--txt3);border-radius:50%;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:0.2s}.typing span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chip{padding:4px 10px;border-radius:20px;border:0.5px solid #00C853;font-size:11px;color:#00C853;background:rgba(0,200,83,0.05);cursor:pointer;font-family:'Lato',sans-serif;transition:background 0.1s}
.chip:hover{background:rgba(0,200,83,0.14)}
.input-bar{padding:10px 12px;border-top:0.5px solid var(--bd);display:flex;gap:8px;align-items:flex-end;background:var(--bg);flex-shrink:0}
.input-bar textarea{flex:1;resize:none;border:0.5px solid var(--bd2);border-radius:9px;padding:8px 11px;font-size:13px;font-family:'Lato',sans-serif;color:var(--txt);background:var(--bg2);min-height:36px;max-height:80px;outline:none;line-height:1.4}
.input-bar textarea:focus{border-color:#00C853}
.send-btn{width:36px;height:36px;border-radius:9px;border:none;background:#00C853;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity 0.1s}
.send-btn:hover{opacity:0.85}.send-btn:disabled{opacity:0.35;cursor:default}
.send-btn i{font-size:15px}
.disclaimer{text-align:center;font-size:10px;color:var(--txt3);padding:3px 12px 7px;flex-shrink:0}
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="logo">Avanza<span>AI</span> <span style="font-size:11px;color:var(--txt2);font-weight:400;font-family:'Lato',sans-serif">Chart Analyzer</span></div>
    <div class="topbar-mid">
      <button class="mode-btn active" onclick="setMode('chart',this)">Chartanalys</button>
      <button class="mode-btn" onclick="setMode('chat',this)">Fri chat</button>
      <button class="mode-btn" onclick="setMode('screen',this)">Screener</button>
    </div>
    <div class="live-badge"><div class="pulse"></div>AI VISION</div>
  </div>

  <div class="main">
    <div class="left-col">
      <div class="sb-section">Ladda upp chart</div>
      <div class="drop-zone" id="dropZone"
        ondragover="handleDrag(event,true)" ondragleave="handleDrag(event,false)" ondrop="handleDrop(event)">
        <input type="file" class="drop-input" id="fileInput" accept="image/*" onchange="handleFile(event)">
        <i class="ti ti-chart-candle drop-icon"></i>
        <div class="drop-title">Släpp chart här</div>
        <div class="drop-sub">PNG, JPG – skärmdump från Avanza, TradingView m.fl.</div>
      </div>
      <button class="analyze-btn" id="analyzeBtn" disabled onclick="analyzeChart()">
        <i class="ti ti-brain"></i> Analysera nu
      </button>

      <div class="sb-section">Snabbfrågor</div>
      <div class="quick-row">
        <button class="qbtn" onclick="quickQ('RSI och MACD – signalerar chartet köp eller sälj?')"><i class="ti ti-wave-saw-tool"></i> RSI & MACD</button>
        <button class="qbtn" onclick="quickQ('Identifiera stöd- och motståndsnivåer i chartet')"><i class="ti ti-arrows-vertical"></i> Stöd & motstånd</button>
        <button class="qbtn" onclick="quickQ('Finns det ett bullish eller bearish mönster?')"><i class="ti ti-trending-up"></i> Chartmönster</button>
        <button class="qbtn" onclick="quickQ('Vad är den kortsiktiga trenden? Bra entry-punkt?')"><i class="ti ti-target"></i> Entry-punkt</button>
        <button class="qbtn" onclick="quickQ('Sätt en stop-loss och take-profit baserat på chartet')"><i class="ti ti-shield"></i> Stop-loss / TP</button>
        <button class="qbtn" onclick="quickQ('Är volymtrenden bullish eller bearish?')"><i class="ti ti-chart-bar"></i> Volymanalys</button>
      </div>

      <div class="sb-section">Tekniska indikatorer</div>
      <div class="indicators-grid">
        <div class="ind-card"><div class="ind-label">TREND</div><div class="ind-val neu" id="indTrend">–</div></div>
        <div class="ind-card"><div class="ind-label">SIGNAL</div><div class="ind-val neu" id="indSignal">–</div></div>
        <div class="ind-card"><div class="ind-label">STYRKA</div><div class="ind-val neu" id="indStrength">–</div></div>
        <div class="ind-card"><div class="ind-label">RISK</div><div class="ind-val neu" id="indRisk">–</div></div>
      </div>
    </div>

    <div class="right-col">
      <div class="messages" id="messages"></div>
      <div class="disclaimer">Teknisk analys = inte garanti · Handla alltid med risk du klarar av att förlora</div>
      <div class="input-bar">
        <textarea id="userInput" placeholder="Fråga om chartet eller skriv fritt..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <i class="ti ti-send"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const API = "https://api.anthropic.com/v1/messages";
const MODEL = "claude-sonnet-4-20250514";
let history = [];
let loading = false;
let currentImageB64 = null;
let currentImageType = null;

const SYSTEM = `Du är en expert daytrader och teknisk analytiker med 15 års erfarenhet av Stockholmsbörsen och nordiska marknader.

När du får en chartbild, gör ALLTID en snabb, strukturerad analys:
1. VERDICT (KÖP / SÄLJ / HÅLL) – direkt och tydligt
2. Konfidensgrad i % (t.ex. 72%)
3. Viktigaste tekniska signaler (max 3 punkter)
4. Stöd/motstånd – konkreta prisnivåer om synliga
5. Stop-loss förslag
6. Tidshorisont (dag/vecka/månad)

Format: Börja alltid med [KÖP], [SÄLJ] eller [HÅLL] på första raden, sedan konfidensgrad, sedan analys.
H�ll svar under 180 ord. Var direkt, konkret, traderspråk.
Svara på svenska.`;

function setMode(m, btn){
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(m==='screen') quickQ('Screena den svenska marknaden nu – vilka 3 aktier har starkast teknisk setup just nu?');
}

function handleDrag(e,on){ e.preventDefault(); document.getElementById('dropZone').classList.toggle('drag',on); }

function handleDrop(e){
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if(file && file.type.startsWith('image/')) loadImage(file);
  document.getElementById('dropZone').classList.remove('drag');
}

function handleFile(e){ const file = e.target.files[0]; if(file) loadImage(file); }

function loadImage(file){
  const reader = new FileReader();
  reader.onload = ev => {
    const dataUrl = ev.target.result;
    currentImageB64 = dataUrl.split(',')[1];
    currentImageType = file.type;
    const dz = document.getElementById('dropZone');
    dz.classList.add('has-img');
    dz.innerHTML = `<img src="${dataUrl}" alt="Chart"><input type="file" class="drop-input" id="fileInput" accept="image/*" onchange="handleFile(event)">`;
    document.getElementById('analyzeBtn').disabled = false;
    addMsg('agent','<b>Chart inläst!</b> Tryck på <b>Analysera nu</b> för full teknisk analys, eller ställ en specifik fråga nedan.',['Analysera direkt','Identifiera trend','Köp eller sälj?']);
  };
  reader.readAsDataURL(file);
}

function updateIndicators(text){
  const low = text.toLowerCase();
  const trend = document.getElementById('indTrend');
  const signal = document.getElementById('indSignal');
  const strength = document.getElementById('indStrength');
  const risk = document.getElementById('indRisk');
  if(low.includes('upptrend')||low.includes('bullish')){trend.textContent='Upp';trend.className='ind-val bull';}
  else if(low.includes('nedtrend')||low.includes('bearish')){trend.textContent='Ned';trend.className='ind-val bear';}
  else{trend.textContent='Sidleds';trend.className='ind-val neu';}
  if(low.includes('[köp]')||low.includes('köpsignal')){signal.textContent='KÖP';signal.className='ind-val bull';}
  else if(low.includes('[sälj]')||low.includes('säljsignal')){signal.textContent='SÄLJ';signal.className='ind-val bear';}
  else{signal.textContent='HÅLL';signal.className='ind-val neu';}
  const confMatch = text.match(/(\d{2})%/);
  if(confMatch){const c=parseInt(confMatch[1]);strength.textContent=c+'%';strength.className='ind-val '+(c>=65?'bull':c>=45?'neu':'bear');}
  if(low.includes('hög risk')||low.includes('volatil')){risk.textContent='Hög';risk.className='ind-val bear';}
  else if(low.includes('låg risk')){risk.textContent='Låg';risk.className='ind-val bull';}
  else{risk.textContent='Medel';risk.className='ind-val neu';}
}

async function analyzeChart(){
  if(!currentImageB64) return;
  await callAI('Gör en komplett teknisk analys av detta chart. Ge tydlig KÖP/SÄLJ/HÅLL-rekommendation med konfidensgrad.', true);
}

async function quickQ(txt){ await callAI(txt, !!currentImageB64); }

async function sendMessage(){
  const inp = document.getElementById('userInput');
  const txt = inp.value.trim();
  if(!txt||loading) return;
  inp.value=''; inp.style.height='auto';
  await callAI(txt, !!currentImageB64);
}

async function callAI(userText, withImage){
  if(loading) return;
  loading = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('analyzeBtn').disabled = true;
  addMsg('user', userText);
  let msgContent;
  if(withImage && currentImageB64){
    msgContent=[{type:'image',source:{type:'base64',media_type:currentImageType,data:currentImageB64}},{type:'text',text:userText}];
  } else { msgContent = userText; }
  history.push({role:'user',content:msgContent});
  showTyping();
  try{
    const res = await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:MODEL,max_tokens:1000,system:SYSTEM,messages:history})
    });
    const d = await res.json();
    hideTyping();
    const reply = d.content?.[0]?.text || 'Ingen respons.';
    history.push({role:'assistant',content:reply});
    updateIndicators(reply);
    addMsg('agent', formatReply(reply), getChips(reply));
  } catch(e){ hideTyping(); addMsg('agent','Kunde inte ansluta. Kontrollera din internetanslutning.'); }
  loading=false;
  document.getElementById('sendBtn').disabled=false;
  if(currentImageB64) document.getElementById('analyzeBtn').disabled=false;
}

function formatReply(text){
  let verdict='',cls='hold',icon='ti-minus';
  if(/\[KÖP\]/i.test(text)){cls='buy';icon='ti-arrow-up';verdict='KÖP';}
  else if(/\[SÄLJ\]/i.test(text)){cls='sell';icon='ti-arrow-down';verdict='SÄLJ';}
  else if(/\[HÅLL\]/i.test(text)){cls='hold';icon='ti-minus';verdict='HÅLL';}
  const confMatch=text.match(/(\d{2,3})%/);
  const conf=confMatch?parseInt(confMatch[1]):null;
  const fillColor=cls==='buy'?'#00C853':cls==='sell'?'#F44336':'#FF9800';
  let html='';
  if(verdict){
    html+=`<div class="verdict ${cls}"><i class="ti ${icon}"></i>${verdict}</div>`;
    if(conf) html+=`<div style="font-size:11px;color:var(--txt2);margin-bottom:2px">Konfidensgrad: <b>${conf}%</b></div><div class="conf-bar"><div class="conf-fill" style="width:${conf}%;background:${fillColor}"></div></div>`;
  }
  const body=text.replace(/\[KÖP\]/gi,'').replace(/\[SÄLJ\]/gi,'').replace(/\[HÅLL\]/gi,'')
    .replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')
    .replace(/^[-•] (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g,m=>`<ul>${m}</ul>`)
    .replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>').trim();
  return html+body;
}

function getChips(reply){
  const l=reply.toLowerCase();
  if(l.includes('köp')||l.includes('bull')) return ['Var är stop-loss?','Prismål?','Ny analys'];
  if(l.includes('sälj')||l.includes('bear')) return ['Short-möjlighet?','Bättre entry senare?'];
  return ['Mer detaljer','Byt tidsram'];
}

function addMsg(role,html,chips=[]){
  const wrap=document.getElementById('messages');
  const row=document.createElement('div');
  row.className=`msg-row ${role==='user'?'user':'agent'}`;
  const av=document.createElement('div');
  av.className=`av ${role==='user'?'usr':'ai'}`;
  av.textContent=role==='user'?'Du':'AI';
  const bub=document.createElement('div');
  bub.className='bubble';
  bub.innerHTML=html;
  if(chips.length){
    const cr=document.createElement('div');cr.className='chips';
    chips.forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.onclick=()=>quickQ(c);cr.appendChild(b);});
    bub.appendChild(cr);
  }
  row.appendChild(av);row.appendChild(bub);
  wrap.appendChild(row);wrap.scrollTop=wrap.scrollHeight;
}

function showTyping(){
  const wrap=document.getElementById('messages');
  const el=document.createElement('div');el.className='typing';el.id='typInd';
  el.innerHTML='<span></span><span></span><span></span>';
  wrap.appendChild(el);wrap.scrollTop=wrap.scrollHeight;
}
function hideTyping(){const e=document.getElementById('typInd');if(e)e.remove();}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,80)+'px';}

addMsg('agent','<b>Chartanalys-agenten är redo.</b><br><br>Ladda upp en skärmdump från Avanza, TradingView eller annan plattform – du får omedelbar <b>KÖP / SÄLJ / HÅLL</b>-signal med teknisk analys.<br><br>Stöder: candlestick, RSI, MACD, Bollinger m.m.',['Hur fungerar det?','Screena marknaden']);
</script>
</body>
</html>
